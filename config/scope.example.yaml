program: example-bugbounty
scope:
  domains: [ai.example.com]
  allow_subdomains: false
  deny_domains: [admin.ai.example.com]
  url_patterns:
    - https://ai.example.com/api/*
  deny_url_patterns:
    - https://ai.example.com/api/admin/*
    - https://ai.example.com/api/delete/*
testing:
  automated_scanning: true
  prompt_injection: true
  system_prompt_leak: true
  indirect_injection: true
  rag_security: true
  tool_abuse: false
  agent_security: false
  destructive_actions: false
  denial_of_service: false
  cross_user_data_access: false
limits:
  requests_per_second: 2
  concurrency: 3
  max_requests_per_run: 3000
approval_required:
  - external_callback
  - file_write
blocked_actions:
  - send_message
  - account_state_change
  - payment
  - delete
