[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-bugbounty-automation"
version = "5.0.1"
description = "Authorized LLM security testing automation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1",
  "httpx>=0.27",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
# P3.2-2 (roadmap v3.2.0 Source Intelligence): optional, same pattern as
# Playwright for the browser adapter -- module import always works, real
# JS/TS AST parsing needs this installed, a clear per-file fallback to the
# regex extractor otherwise (source/parsers/javascript.py).
jsts = [
  "tree-sitter>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
]

[tool.setuptools]
py-modules = ["cli", "main"]
packages = [
  "adapters",
  "adapters.llm",
  "adapters.recon",
  "adapters.discovery",
  "adapters.scanner",
  "adapters.secrets",
  "attack_surface",
  "attacks",
  "core",
  "correlation",
  "events",
  "hybrid",
  "live",
  "manifest",
  "packs",
  "plugins",
  "scenario",
  "findings",
  "recon",
  "rag_harness",
  "source",
  "source.parsers",
  "source.frameworks",
  "source.sources",
  "source.sinks",
  "source.dataflow",
  "source.auth",
  "source.ai",
  "scope",
  "targets",
  "testcase",
  "executor",
  "tools",
  "traces",
  "judges",
  "storage",
  "reporting",
  "reproduction",
  "validation",
]

[tool.setuptools.package-data]
validation = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "p0: v5.0 plan 7.3 P0 invariants (crash, scope bypass, evidence damage, dangerous-request misclassification)",
    "p1: v5.0 plan 7.3 P1 invariants (CLI flow breaks, reproduction failures)",
]
