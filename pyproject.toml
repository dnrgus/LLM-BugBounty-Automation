[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-bugbounty-automation"
version = "0.1.0"
description = "Authorized LLM security testing automation pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["cli", "main"]
packages = [
  "adapters",
  "adapters.llm",
  "adapters.recon",
  "adapters.discovery",
  "adapters.scanner",
  "adapters.secrets",
  "attack_surface",
  "attacks",
  "core",
  "findings",
  "recon",
  "rag_harness",
  "scope",
  "targets",
  "testcase",
  "executor",
  "traces",
  "judges",
  "storage",
  "reporting",
  "reproduction",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
