name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # P4.4-D (roadmap v4.4.0 Accuracy & Benchmark): includes the
        # `jsts` extra so the JS/TS AST tests (tree-sitter) actually
        # run here instead of silently skipping -- they'd been
        # importorskip-ing on every CI run since v3.2.0/v4.2.0 because
        # this step only ever installed `.[dev]`.
        run: python -m pip install -e ".[dev,jsts]"

      - name: Lint (bug-catching rules only)
        run: ruff check .

      - name: P0/P1 regression suite (v4.7 WP-08)
        run: pytest -q -m "p0 or p1" tests/regression

      - name: Unit + integration tests
        run: pytest -q

      - name: Doctor smoke
        run: python main.py doctor

      - name: Judge benchmark gate
        run: python main.py judge-benchmark

      - name: Ground-truth quality gate
        run: python main.py quality-gate

      - name: v5.0.0 release gate checklist (G1-G10, offline)
        run: python main.py release-check

      - name: Benchmark dataset regression gate (v4.7 WP-07)
        run: python main.py benchmark --baseline benchmarks/baselines/baseline.json --timeout 120 --out results/BugBounty-Results/_internal/runs/benchmark-report.json

      - name: Sample run smoke (fake targets)
        run: |
          python main.py sample-run
          python main.py sample-run --target fake-agent
          python main.py sample-run --target fake-rag

      - name: Full orchestrator smoke (recon -> scan -> adaptive -> external_scan -> dedup)
        run: python main.py scan --profile full

      - name: SOURCE mode smoke (static source audit)
        run: python main.py audit tests/fixtures/source/sample_app

      - name: LIVE + HYBRID mode smoke (local static server, no external network)
        run: |
          python -m http.server 8123 --directory tests/fixtures/source/sample_app &
          SERVER_PID=$!
          sleep 1
          python main.py scan http://127.0.0.1:8123/ --scope config/scope.ci.yaml
          python main.py scan http://127.0.0.1:8123/ --source tests/fixtures/source/sample_app --scope config/scope.ci.yaml
          python main.py scan --source tests/fixtures/source/rest_api_app --artifact results/BugBounty-Results/_internal/runs/artifacts/ci_scan.json
          python main.py validate --artifact results/BugBounty-Results/_internal/runs/artifacts/ci_scan.json --base-url http://127.0.0.1:8123 --scope config/scope.ci.yaml --db results/BugBounty-Results/_internal/runs/ci_validate.sqlite > results/BugBounty-Results/_internal/runs/ci_validate.json
          python main.py report --run-id "$(python -c 'import json;print(json.load(open("results/BugBounty-Results/_internal/runs/ci_validate.json"))["run_id"])')" --db results/BugBounty-Results/_internal/runs/ci_validate.sqlite --out results/BugBounty-Results/_internal/reports/ci_validation
          kill "$SERVER_PID" || true

      - name: Confirm no secrets or raw evidence are staged
        run: |
          git status --short
          test -z "$(git status --short -- results/ 2>/dev/null)"
